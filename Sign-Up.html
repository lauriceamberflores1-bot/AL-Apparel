<!DOCTYPE html>
<html>
<head>
    <link href="css/style.css" rel="stylesheet">
    <title>
       Sign-Up | A&L's Apparel
    </title>
    <style>
body{
  background-image: url(background/background_signup.jpg);
  background-position: 100%;
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
  background-color: #f087a77a;
  background-blend-mode: soft-light;
}

header {
  background-color: #571424c0;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 5px 5px 5px #e75782; 
}

.icon-bar {
  background-color: #4b1a3700; 
  padding: 5px 15px;
  border-radius: 12px;
  display: flex;
  gap: 10px;
}

.icon-bar img {
  display: block;
  height: 100px;
  width: 100px;
}

nav{
  position: fixed;
  top: 150px; 
  left: 0;
  width: 15%;
  height: 800px;
  background: #571424c0;
  padding: 20px;
  opacity: 0;
  transform: translateX(-100%); 
  visibility: hidden;
  transition: all 0.4s ease;
  z-index: 1000;
  box-shadow: 4px 4px 4px #e75782, 0px -2px 0px #e9bcc2;
  border-radius: 0px 12px 0 12px;
  backdrop-filter: blur(1px);
}

.nav_text_1
{
  font-size: 35px;    
  font-family: Georgia;
  font-weight: lighter;
  color: #ec879d;   
  font-style: normal;   
  text-shadow: 3px 3px 2px #2b120f, 0px -2px 0px #e0a89e;
  letter-spacing: 2px;
}

nav.show {
  opacity: 1;
  transform: translateX(0); 
  visibility: visible;
}

nav ul {
  padding: 0;
}

nav a:link, nav a:visited {
  color: #f7bac2;
}
nav a:hover, nav a:active {
  color: #e785a6;
}

.nav_upperwear_1
{
  font-size: 25px;    
  font-family: Georgia;
  font-weight: lighter;
  color: #55322a;   
  font-style: normal;   
  text-shadow: 3px 3px 2px #c4422b;
  letter-spacing: 1px;
}

.nav_lowerwear_2
{
  font-size: 25px;    
  font-family: Georgia;
  font-weight: lighter;
  color: #55322a;   
  font-style: normal;   
  text-shadow: 3px 3px 2px #c4422b;
  letter-spacing: 1px;
}
.nav_accessories_3
{
  font-size: 25px;    
  font-family: Georgia;
  font-weight: lighter;
  color: #55322a;   
  font-style: normal;   
  text-shadow: 3px 3px 2px #c4422b;
  letter-spacing: 1px;
}

.sign_container {
  margin: 30px auto;
  width: 700px;
  background-color: rgba(245, 149, 186, 0.322);
  border-radius: 20px;
  backdrop-filter: blur(2px);
  text-align: center;           
  box-shadow: 0 4px 10px rgba(60, 16, 85, 0.705);     
}

.sign {
  font-size: 75px;    
  font-family: Book Antiqua;
  font-weight: lighter;
  color: #751c30;   
  font-style: normal;   
  text-shadow: 3px 3px 2px #d44a84, 0px -2px 0px #f0a6c5, -1px -1px 5px #811852 ;
  letter-spacing: 1px;
}
.sign_container2 {
  margin: 30px auto;
  width: 400px;
  padding: 30px;
  background-color: rgba(245, 149, 186, 0.411);
  border-radius: 20px;
  backdrop-filter: blur(2px);
  text-align: center;           
  box-shadow: 0 4px 10px rgba(60, 16, 85, 0.705); 
}

label
{
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-weight: bolder;
    color: #fabbd5;
    text-shadow: 2px 2px 2px #611425, 0px -1px 0px #611425;
    letter-spacing: 1px;
    font-size: 16px;
    
}
form {
    padding: 20px;
    max-width: 400px;
    border-radius: 8px;
    box-shadow: 1px 0 10px #ffd0e7;
    text-align: left;
}

label {
    font-weight: bolder;
    font-family: Georgia, 'Times New Roman', Times, serif;
    margin-top: 10px;

}

input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
    margin-bottom: 15px;
    border: 2px solid #7c2437;
    border-radius: 10px;
    box-sizing: border-box;
    box-shadow: 1px 1px 3px #be2f66;
}

input[type="checkbox"] {
    margin-right: 6px;
    border: 3px solid #7c2437;
    border-radius: 10px;
    box-shadow: 1px 1px 4px #be2f66;
    margin-bottom: 10px;
}

input[type="submit"] {
    background-color: #c75282;
    color: #49101d;
    width: 100%;
    padding: 8px;
    margin-top: 10px;
    margin-bottom: 10px;
    border: none;
    border: 2px solid #7c2437;
    border-radius: 3px;
    box-shadow: 1px 1px 4px #be2f66;
    cursor: pointer;
    font-size: 16px;
    font-family: Book Antiqua;
    letter-spacing: 1px;
}

input[type="submit"]:hover {
    background-color: #811852;
}

.account
{
    font-family: Georgia;
    margin: 5px 0;
    font-weight: bold;
    letter-spacing: 1px;
    color: #fcd6d9;
    font-size: 17px;
    text-shadow: 1px 1px 1px #461031, 0px -1px 0px #6e1a4e ;
}

a:hover {
  color: #c44a73;
}

.contact_us {
  position: fixed;
  bottom: 90px;      
  right: 30px;       
  z-index: 1000;     
  border-radius: 12px;
  padding: 8px;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.contact_us:hover {
  transform: scale(1.1);
}

.contact_us img {
  width: 100px;       
  height: auto;
  border-radius: 8px;
}

</style>

</head>

                <label for="name">Username:</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Username" required> <br>
                <h2 class="account"> Have an account? <a href="LogIn.html" class="account"> Log In </a>  </h2> <br>
                <label for="Email">Email:</label>

                <label for="Password">Password:</label>
                <input type="password" id="Password" name="Password" placeholder="Enter Your Password" required> <br>

                <label for="Password">Confirm Password:</label>
                <input type="password" id="Password" name="Password" placeholder="Enter Your Password" required> <br>
                
                <label for="Terms">I Accept the Terms and Conditions</label>
                <input type="checkbox" id="accept" name="terms" value="accept" required> <br>

<script>
const searchButton = document.getElementById('searchButton');
const navBar = document.querySelector('nav');

searchButton.addEventListener('click', (e) => {
  e.preventDefault();
  navBar.classList.toggle('show');
});

function redirectPage(event) {
  event.preventDefault();
  window.location.href = "login.html";
}


</script>


</html>
